<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SkyGraph Routen-Explorer</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">SkyGraph</div>
  <select id="scan-select" aria-label="Scan"></select>
  <button type="button" class="icon-btn" id="panel-toggle" title="Einstellungen" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94a7.9 7.9 0 0 0 .06-.94 7.9 7.9 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.4 7.4 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.86a.5.5 0 0 0 .12.62l2.03 1.58a7.9 7.9 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32c.13.22.38.3.6.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6Z"/>
    </svg>
  </button>
</header>

<div class="archive-bar" id="archive-bar" hidden>
  <input type="range" id="archive-day" min="0" max="0" step="1" value="0" aria-label="Startdatum">
  <span class="archive-label" id="archive-label">–</span>
  <label class="inline">Tage
    <select id="archive-length">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>
  </label>
  <label class="inline check"><input type="checkbox" id="archive-original"> Originalcode</label>
  <span class="day-note" id="day-note"></span>
  <div class="totals" id="totals">–</div>
</div>

<main class="layout">
  <section class="map-wrap">
    <div id="map" class="map"></div>
    <div class="map-note" id="map-note"></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="busy" id="busy" hidden>rechnet …</div>
  </section>

  <aside class="sidebar" id="sidebar">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-hop" role="tab">Nächster Hop</button>
      <button type="button" class="tab" id="tab-settings" role="tab">Einstellungen</button>
    </div>

    <section class="panel tabpanel" id="settings-panel" role="tabpanel" hidden>
      <div class="field">
        <span class="label">Modus</span>
        <div class="segmented" id="mode-group">
          <label><input type="radio" name="mode" value="rt" checked> Rundreise</label>
          <label><input type="radio" name="mode" value="ow"> One-way</label>
        </div>
      </div>
      <div class="field row">
        <label class="wide">Startstadt<select id="start-select"></select></label>
        <label class="narrow">Radius km<input type="number" id="start-radius" value="180" min="0" step="20"></label>
      </div>
      <div class="resolved" id="start-resolved"></div>
      <div class="field row">
        <label class="wide">Rückkehr-Stadt<select id="return-select"></select></label>
        <label class="narrow">Radius km<input type="number" id="return-radius" value="180" min="0" step="20"></label>
      </div>
      <div class="resolved" id="return-resolved">
        <button type="button" class="mini" id="return-reset">= Startstadt</button>
      </div>
      <div class="field row">
        <label>min. Gap (h)<input type="number" id="min-gap" value="1" min="0" step="0.5"></label>
        <label>max. Gap (h)<input type="number" id="max-gap" value="18" min="0.5" step="0.5"></label>
      </div>
      <div class="field row">
        <label>Flug-Limit<input type="number" id="max-flights" min="1" step="1" placeholder="kein Limit"></label>
        <label>Tages-Cap<input type="number" id="daily-cap" value="3" min="1" step="1"></label>
      </div>
      <div class="field">
        <label>Cap-Modus
          <select id="cap-mode">
            <option value="rolling24" selected>rolling24 (24-h-Fenster)</option>
            <option value="calendar">calendar (Kalendertag)</option>
            <option value="none">ohne Cap</option>
          </select>
        </label>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="highlight-new" checked> neue Länder hervorheben</label>
      </div>
      <div class="field">
        <span class="label">Pflichtstädte – die Route muss über alle davon führen</span>
        <div class="add-row">
          <select id="required-select"></select>
          <button type="button" class="mini plus" id="required-add" title="Stadt hinzufügen">+</button>
        </div>
        <div class="chips" id="required-chips"></div>
      </div>
    </section>

    <section class="panel tabpanel grow" id="hop-panel" role="tabpanel">
      <div id="detail-hint" class="hint">Stadt auf der Karte oder in der Liste anklicken.</div>
      <ul class="city-list" id="city-list"></ul>
      <div id="flight-list-wrap" hidden>
        <button type="button" class="mini back" id="flight-back">← zurück zur Städteliste</button>
        <div id="detail-title" class="detail-title"></div>
        <ul class="flight-list" id="flight-list"></ul>
      </div>
    </section>
  </aside>
</main>

<footer class="breadcrumb-bar">
  <div class="crumbs" id="crumbs">
    <span id="breadcrumb">Dortmund</span>
  </div>
  <span class="price" id="price"></span>
  <div class="actions">
    <button type="button" id="back-btn" disabled>← Zurück</button>
    <button type="button" id="reset-btn" disabled>Reset</button>
  </div>
</footer>

<script src="dp.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
